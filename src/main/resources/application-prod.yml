# Perfil de producción: overrides sobre application.yml
# Activar con SPRING_PROFILES_ACTIVE=prod

spring:
  main:
    # En producción NO usamos lazy-init: cada bean se resuelve al arrancar,
    # evitando tiempo de cómputo "escondido" en la primera request real.
    lazy-initialization: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  datasource:
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    baseline-on-migrate: true
    # En producción nunca dejamos que Flyway limpie la base ante un error de validación
    clean-on-validation-error: false
    clean-disabled: true

# Cookies HttpOnly de auth: el frontend vive en otro origen (Vercel).
# SameSite=None + Secure son obligatorios para que el navegador envíe
# las cookies en requests cross-origin (login/refresh del panel admin).
jwt:
  cookie-secure: ${JWT_COOKIE_SECURE:true}
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:None}

app:
  admin:
    seed-enabled: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
